<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 나만의 영화 티어리스트</title>
    <style>
        /* 기본 스타일 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; }
        .description { color: #aaaaaa; margin-bottom: 20px; text-align: center; }

        /* 버튼 및 입력창 스타일 */
        .control-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #45a049; }
        
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #333;
            color: white;
            width: 200px;
        }

        /* 티어리스트 표 스타일 */
        .tier-board {
            width: 100%;
            max-width: 900px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .tier-row {
            display: flex;
            border-bottom: 2px solid #333;
            min-height: 100px; /* 텍스트 카드에 맞춰 높이 축소 */
        }
        .tier-row:last-child { border-bottom: none; }
        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
        }
        .label-s { background-color: #ff7f7f; }
        .label-a { background-color: #ffbf7f; }
        .label-b { background-color: #ffff7f; }
        .label-c { background-color: #7fff7f; }
        .label-d { background-color: #7fbfff; }

        .tier-zone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 15px;
            gap: 12px;
            background-color: #1a1a1a;
            min-height: 80px;
        }

        /* 미분류 영역 */
        .unranked-container {
            width: 100%;
            max-width: 900px;
        }
        .unranked-container h2 {
            font-size: 20px;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .unranked-zone {
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 120px;
        }

        /* 영화 텍스트 카드 스타일 */
        .movie-card {
            background-color: #3a3a3a;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 20px; /* 둥근 알약 모양 */
            border: 1px solid #555;
            font-size: 15px;
            font-weight: bold;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
            user-select: none; /* 텍스트 드래그 방지 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
        }
        .movie-card:hover {
            background-color: #4a4a4a;
        }
        .movie-card:active {
            cursor: grabbing;
            transform: scale(1.05);
            background-color: #5a5a5a;
        }
    </style>
</head>
<body>

    <h1>🎬 나만의 영화 티어리스트</h1>
    <p class="description">영화 카드를 끌어서 등급을 매기고, 없는 영화는 직접 추가해 보세요!</p>
    
    <div class="control-panel">
        <input type="text" id="new-movie-input" placeholder="추가할 영화 제목 입력" onkeypress="if(event.keyCode==13) addNewMovie()">
        <button onclick="addNewMovie()">➕ 영화 추가</button>
        <button id="share-btn" style="background-color: #008CBA;">🔗 공유용 링크 복사</button>
    </div>

    <!-- 티어리스트 영역 -->
    <div class="tier-board">
        <div class="tier-row"><div class="tier-label label-s">S</div><div class="tier-zone" id="tier-s"></div></div>
        <div class="tier-row"><div class="tier-label label-a">A</div><div class="tier-zone" id="tier-a"></div></div>
        <div class="tier-row"><div class="tier-label label-b">B</div><div class="tier-zone" id="tier-b"></div></div>
        <div class="tier-row"><div class="tier-label label-c">C</div><div class="tier-zone" id="tier-c"></div></div>
        <div class="tier-row"><div class="tier-label label-d">D</div><div class="tier-zone" id="tier-d"></div></div>
    </div>

    <!-- 미분류 영역 -->
    <div class="unranked-container">
        <h2>미분류 영화</h2>
        <div class="tier-zone unranked-zone" id="tier-unranked"></div>
    </div>

    <script>
        // 1. 기본 영화 데이터 (이미지 URL 제거, 제목만 유지)
        const defaultMovies = [
            { id: 'm1', title: '기생충' },
            { id: 'm2', title: '인터스텔라' },
            { id: 'm3', title: '라라랜드' },
            { id: 'm4', title: '센과 치히로의 행방불명' },
            { id: 'm5', title: '어벤져스: 엔드게임' },
            { id: 'm6', title: '범죄도시' },
            { id: 'm7', title: '타이타닉' },
            { id: 'm8', title: '토이 스토리' }
        ];

        let customMovies = []; 
        const zones = ['tier-s', 'tier-a', 'tier-b', 'tier-c', 'tier-d', 'tier-unranked'];

        // 2. 초기화 함수
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            let state = {};

            // URL에서 '직접 추가한 영화' 데이터 복원
            const customData = urlParams.get('custom');
            if (customData) {
                customMovies = customData.split('|').map(item => {
                    const [id, title] = item.split(':');
                    return { id, title: decodeURIComponent(title) };
                });
            } else {
                const savedCustom = localStorage.getItem('customMovies');
                if (savedCustom) customMovies = JSON.parse(savedCustom);
            }

            // URL에서 '배치 상태' 복원
            if (urlParams.get('tier-unranked') !== null || urlParams.get('tier-s') !== null) {
                zones.forEach(zone => {
                    const ids = urlParams.get(zone);
                    state[zone] = ids ? ids.split(',') : [];
                });
            } else {
                const savedState = localStorage.getItem('tierListState');
                if (savedState) {
                    state = JSON.parse(savedState);
                } else {
                    state['tier-unranked'] = defaultMovies.map(m => m.id);
                }
            }

            // 모든 영화(기본+추가)를 화면에 그리기
            const allMovies = [...defaultMovies, ...customMovies];
            
            allMovies.forEach(movie => {
                const cardEl = createCardElement(movie);
                
                let placed = false;
                for (const zone of zones) {
                    if (state[zone] && state[zone].includes(movie.id)) {
                        document.getElementById(zone).appendChild(cardEl);
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    document.getElementById('tier-unranked').appendChild(cardEl);
                }
            });

            saveState();
        }

        // 3. 텍스트 카드 HTML 요소 생성 함수
        function createCardElement(movie) {
            const el = document.createElement('div');
            el.innerText = movie.title;
            el.id = movie.id;
            el.className = 'movie-card';
            el.draggable = true;

            // 드래그 시작 이벤트
            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });
            return el;
        }

        // 4. 새 영화 추가 함수
        function addNewMovie() {
            const input = document.getElementById('new-movie-input');
            const title = input.value.trim();
            
            if (!title) {
                alert('영화 제목을 입력해주세요!');
                return;
            }

            const newMovie = { id: 'c_' + Date.now(), title: title };
            customMovies.push(newMovie);
            
            const cardEl = createCardElement(newMovie);
            document.getElementById('tier-unranked').appendChild(cardEl);
            
            input.value = ''; 
            saveState(); 
        }

        // 5. 드래그 앤 드롭 설정
        document.querySelectorAll('.tier-zone').forEach(zone => {
            zone.addEventListener('dragover', (e) => e.preventDefault());
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const id = e.dataTransfer.getData('text/plain');
                const draggedEl = document.getElementById(id);
                
                // 카드를 구역에 놓았을 때와 다른 카드 위에 놓았을 때 모두 정상 작동하도록 처리
                if (e.target.classList.contains('tier-zone')) {
                    e.target.appendChild(draggedEl);
                } else if (e.target.classList.contains('movie-card')) {
                    e.target.parentElement.appendChild(draggedEl);
                }
                saveState();
            });
        });

        // 6. 상태 저장 (로컬 스토리지 & URL)
        function saveState() {
            const state = {};
            const urlParams = new URLSearchParams();

            zones.forEach(zone => {
                const container = document.getElementById(zone);
                const ids = Array.from(container.children).map(el => el.id);
                state[zone] = ids;
                if (ids.length > 0) urlParams.set(zone, ids.join(','));
            });

            if (customMovies.length > 0) {
                const customString = customMovies.map(m => `${m.id}:${encodeURIComponent(m.title)}`).join('|');
                urlParams.set('custom', customString);
            }

            localStorage.setItem('tierListState', JSON.stringify(state));
            localStorage.setItem('customMovies', JSON.stringify(customMovies));

            const newUrl = window.location.pathname + '?' + urlParams.toString();
            window.history.replaceState(null, '', newUrl);
        }

        // 7. 공유 버튼
        document.getElementById('share-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('링크가 복사되었습니다! 친구에게 공유해보세요.');
            }).catch(() => {
                alert('링크 복사에 실패했습니다. 주소창을 직접 복사해주세요.');
            });
        });

        init();
    </script>
</body>
</html>
