<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 나만의 영화 티어리스트</title>
    <style>
        /* 기본 페이지 스타일 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #aaaaaa;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 공유 버튼 스타일 */
        #share-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background-color 0.2s;
        }
        #share-btn:hover {
            background-color: #45a049;
        }

        /* 티어리스트 표 전체 스타일 */
        .tier-board {
            width: 100%;
            max-width: 900px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* 각 등급(행) 스타일 */
        .tier-row {
            display: flex;
            border-bottom: 2px solid #333;
            min-height: 140px;
        }
        .tier-row:last-child {
            border-bottom: none;
        }

        /* 등급 알파벳 라벨 스타일 */
        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
        }
        /* 등급별 배경색 */
        .label-s { background-color: #ff7f7f; }
        .label-a { background-color: #ffbf7f; }
        .label-b { background-color: #ffff7f; }
        .label-c { background-color: #7fff7f; }
        .label-d { background-color: #7fbfff; }

        /* 영화 포스터가 놓일 공간 */
        .tier-zone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            background-color: #1a1a1a;
            min-height: 120px;
        }

        /* 미분류 영화 영역 */
        .unranked-container {
            width: 100%;
            max-width: 900px;
        }
        .unranked-container h2 {
            font-size: 20px;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }
        .unranked-zone {
            display: flex;
            flex-wrap: wrap;
            padding: 15px;
            gap: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 150px;
        }

        /* 영화 포스터 이미지 스타일 */
        .movie-poster {
            width: 90px;
            height: 130px;
            object-fit: cover;
            border-radius: 4px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .movie-poster:active {
            cursor: grabbing;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>🎬 나만의 영화 티어리스트</h1>
    <p class="description">포스터를 마우스로 끌어서 등급을 매겨보세요!<br>완성 후 아래 버튼을 누르면 현재 상태가 저장된 링크가 복사됩니다.</p>
    
    <button id="share-btn">🔗 공유용 링크 복사하기</button>

    <!-- 티어리스트 영역 -->
    <div class="tier-board">
        <div class="tier-row">
            <div class="tier-label label-s">S</div>
            <div class="tier-zone" id="tier-s"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-a">A</div>
            <div class="tier-zone" id="tier-a"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-b">B</div>
            <div class="tier-zone" id="tier-b"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-c">C</div>
            <div class="tier-zone" id="tier-c"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label label-d">D</div>
            <div class="tier-zone" id="tier-d"></div>
        </div>
    </div>

    <!-- 미분류 영역 -->
    <div class="unranked-container">
        <h2>미분류 영화</h2>
        <div class="tier-zone unranked-zone" id="tier-unranked"></div>
    </div>

    <script>
        // 1. 영화 데이터 준비 (실제 위키미디어 포스터 이미지 링크 사용)
        const movies = [
            { id: 'm1', title: '기생충', url: 'https://upload.wikimedia.org/wikipedia/ko/6/60/%EA%B8%B0%EC%83%9D%EC%B6%A9_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' },
            { id: 'm2', title: '인터스텔라', url: 'https://upload.wikimedia.org/wikipedia/ko/b/b0/%EC%9D%B8%ED%84%B0%EC%8A%A4%ED%85%94%EB%9D%BC_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' },
            { id: 'm3', title: '라라랜드', url: 'https://upload.wikimedia.org/wikipedia/ko/3/34/%EB%9D%BC%EB%9D%BC%EB%9E%9C%EB%93%9C_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' },
            { id: 'm4', title: '센과 치히로의 행방불명', url: 'https://upload.wikimedia.org/wikipedia/ko/c/c3/%EC%84%BC%EA%B3%BC_%EC%B9%98%ED%9E%88%EB%A1%9C%EC%9D%98_%ED%96%89%EB%B0%A9%EB%B6%88%EB%AA%85_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' },
            { id: 'm5', title: '어벤져스: 엔드게임', url: 'https://upload.wikimedia.org/wikipedia/ko/e/e9/%EC%96%B4%EB%B2%A4%EC%A0%B8%EC%8A%A4_%EC%97%94%EB%93%9C%EA%B2%8C%EC%9E%84_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' },
            { id: 'm6', title: '범죄도시', url: 'https://upload.wikimedia.org/wikipedia/ko/3/30/%EB%B2%94%EC%A3%84%EB%8F%84%EC%8B%9C_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' },
            { id: 'm7', title: '타이타닉', url: 'https://upload.wikimedia.org/wikipedia/ko/9/9d/%ED%83%80%EC%9D%B4%ED%83%80%EB%8B%89_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' },
            { id: 'm8', title: '토이 스토리', url: 'https://upload.wikimedia.org/wikipedia/ko/1/13/%ED%86%A0%EC%9D%B4_%EC%8A%A4%ED%86%A0%EB%A6%AC_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg' }
        ];

        const zones = ['tier-s', 'tier-a', 'tier-b', 'tier-c', 'tier-d', 'tier-unranked'];

        // 2. 초기화 함수 (페이지가 열릴 때 실행)
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            let state = {};

            // URL에 공유된 데이터가 있는지 확인
            if (Array.from(urlParams).length > 0) {
                zones.forEach(zone => {
                    const ids = urlParams.get(zone);
                    state[zone] = ids ? ids.split(',') : [];
                });
            } else {
                // URL에 데이터가 없으면 로컬 스토리지(내 컴퓨터 저장소) 확인
                const savedState = localStorage.getItem('tierListState');
                if (savedState) {
                    state = JSON.parse(savedState);
                } else {
                    // 저장된 게 아예 없으면 모든 영화를 '미분류'로 설정
                    state['tier-unranked'] = movies.map(m => m.id);
                }
            }

            // 상태에 맞게 화면에 이미지 배치
            movies.forEach(movie => {
                const img = document.createElement('img');
                img.src = movie.url;
                img.id = movie.id;
                img.className = 'movie-poster';
                img.draggable = true;
                img.title = movie.title; // 마우스 올리면 제목 표시

                // 드래그 시작할 때 영화 ID 기억하기
                img.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.id);
                });

                // 이 영화가 어느 구역에 속해야 하는지 찾아서 넣기
                let placed = false;
                for (const zone of zones) {
                    if (state[zone] && state[zone].includes(movie.id)) {
                        document.getElementById(zone).appendChild(img);
                        placed = true;
                        break;
                    }
                }
                // 만약 어디에도 속하지 않았다면 미분류로
                if (!placed) {
                    document.getElementById('tier-unranked').appendChild(img);
                }
            });

            // URL 상태를 로컬 스토리지에 덮어씌워 이어서 작업할 수 있게 함
            saveState();
        }

        // 3. 드래그 앤 드롭 기능 설정
        document.querySelectorAll('.tier-zone').forEach(zone => {
            // 요소가 구역 위에 올라왔을 때 (드롭 허용)
            zone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
            });

            // 요소를 구역에 떨어뜨렸을 때
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const id = e.dataTransfer.getData('text/plain');
                const draggedImg = document.getElementById(id);
                
                // 포스터 위에 떨어뜨렸을 경우를 대비해, 부모(구역)를 찾아서 추가
                if (e.target.classList.contains('tier-zone')) {
                    e.target.appendChild(draggedImg);
                } else if (e.target.classList.contains('movie-poster')) {
                    e.target.parentElement.appendChild(draggedImg);
                }
                
                // 위치가 바뀌었으니 상태 저장
                saveState();
            });
        });

        // 4. 상태 저장 및 URL 업데이트 함수
        function saveState() {
            const state = {};
            const urlParams = new URLSearchParams();

            zones.forEach(zone => {
                const container = document.getElementById(zone);
                // 해당 구역 안의 모든 이미지 ID를 배열로 수집
                const ids = Array.from(container.children).map(img => img.id);
                state[zone] = ids;
                
                if (ids.length > 0) {
                    urlParams.set(zone, ids.join(','));
                }
            });

            // 내 브라우저에 저장 (껐다 켜도 유지)
            localStorage.setItem('tierListState', JSON.stringify(state));

            // 주소창 URL을 새로고침 없이 업데이트 (공유 준비)
            const newUrl = window.location.pathname + '?' + urlParams.toString();
            window.history.replaceState(null, '', newUrl);
        }

        // 5. 공유 버튼 클릭 이벤트
        document.getElementById('share-btn').addEventListener('click', () => {
            const currentUrl = window.location.href;
            
            // 클립보드에 현재 주소 복사
            navigator.clipboard.writeText(currentUrl).then(() => {
                alert('친구가 똑같은 화면을 볼 수 있는 링크가 복사되었습니다!\n원하는 곳에 붙여넣기(Ctrl+V) 하세요.');
            }).catch(err => {
                alert('링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.');
            });
        });

        // 스크립트가 로드되면 초기화 함수 실행
        init();
    </script>
</body>
</html>
